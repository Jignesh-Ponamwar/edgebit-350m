model:
  hidden_dim: 768
  ffn_dim: 2048
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4
  head_dim: 64
  vocab_size: 151936
  max_seq_len: 2048
  rms_norm_eps: 1.0e-6
  rope_theta: 10000.0
  tie_embeddings: true
  group_size: 128
  quant_mode: "ternary"
  embedding_quant: "nf4"
  kv_cache_quant: true
  use_subln: true
  use_qk_norm: true
  qk_norm_type: "rmsnorm"
